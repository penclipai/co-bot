<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自聊 · co-bot</title>
<style>
  :root {
    --bg: #ededed; --bar: #f7f7f7; --bubble: #ffffff; --ink: #191919; --muted: #8a8a8a; --line: #dcdcdc; --bubble-line: #d4d4d4;
    --accent: #2b6cb0;
    --sans: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --bar: #1c1c1c; --bubble: #2c2c2c; --ink: #e8e8e8; --muted: #8d8d8d; --line: #333; --bubble-line: #4a4a4a; --accent: #7fb0e8; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; border-inline: 1px solid var(--line); }

  header { display: grid; grid-template-columns: 76px minmax(0, 1fr) 112px; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
  header .back { color: var(--ink); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  header .back b { font-size: 22px; font-weight: 300; line-height: 1; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; text-align: center; min-width: 0; }
  header h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .more { justify-self: end; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c0392b; }
  .dot.on { background: #27ae60; }

  #list { flex: 1; overflow-y: auto; padding: 8px 12px 16px; display: flex; flex-direction: column; }
  .chat-tabs { display: flex; gap: 6px; padding: 6px 10px; background: var(--bar); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
  .ctab { position: relative; border: 1px solid var(--line); background: var(--bubble); color: var(--ink); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .ctab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .ctab .ubadge { display: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #e74c3c; color: #fff; font-size: 10.5px; line-height: 16px; text-align: center; }
  .ctab.has-unread .ubadge { display: inline-block; }
  .when { align-self: center; color: var(--muted); font-size: 13px; margin: 14px 0 8px; }
  .row { display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; margin: 6px 0; }
  .row.other { justify-content: flex-start; }
  .col { display: flex; flex-direction: column; align-items: flex-end; max-width: calc(100% - 56px); min-width: 0; }
  .row.other .col { align-items: flex-start; }
  .sender-lbl { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; padding-left: 2px; }
  .avatar { width: 40px; height: 40px; border-radius: 6px; flex: none; background: linear-gradient(160deg, #dbe9f7, #b8cfe8); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #34506e; }
  .row.other .avatar { background: linear-gradient(160deg, #f5e2cf, #e2c1a0); color: #634120; }
  .bubble { position: relative; background: var(--bubble); border-radius: 6px; padding: 9px 12px; max-width: 100%; overflow-wrap: anywhere; cursor: pointer; }
  .bubble::after { content: ""; position: absolute; right: -6px; top: 13px; border: 6px solid transparent; border-right: 0; border-left-color: var(--bubble); }
  .row.other .bubble::after { right: auto; left: -6px; border-left: 0; border-right: 6px solid var(--bubble); border-right-color: var(--bubble); }
  .bubble p { margin: 0; white-space: pre-wrap; }
  .bubble p + p { margin-top: 6px; }
  .bubble .at { color: var(--accent); }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { white-space: normal; margin: 0 0 6px; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 16px; margin: 8px 0 4px; }
  .md ul, .md ol { margin: 2px 0 6px; padding-left: 1.3em; }
  .md code { font: 13px var(--mono); background: rgba(127,127,127,.15); padding: 0 4px; border-radius: 4px; }
  .md pre { margin: 4px 0 6px; padding: 8px 10px; background: rgba(127,127,127,.12); border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; }
  .md pre code { background: none; padding: 0; }
  .md pre .add { color: #27ae60; } .md pre .del { color: #e74c3c; }
  .md blockquote { margin: 2px 0 6px; padding: 0 8px; border-left: 3px solid var(--bubble-line); color: var(--muted); }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md a { color: var(--accent); }
  .md hr { border: 0; border-top: 1px solid var(--bubble-line); margin: 8px 0; }
  .md .tbl { overflow-x: auto; max-width: 100%; } .md table { border-collapse: collapse; font-size: 14px; } .md th, .md td { border: 1px solid var(--bubble-line); padding: 3px 7px; overflow-wrap: break-word; word-break: normal; } .md th { white-space: nowrap; background: rgba(127,127,127,.08); }
  .file { display: flex; align-items: center; gap: 10px; min-width: 200px; max-width: 260px; text-decoration: none; color: inherit; }
  .file .fi { flex: none; width: 36px; height: 44px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: #5b8def; }
  .file .fi.md { background: #3a8f5c; } .file .fi.html { background: #e07b39; }
  .file .fn { flex: 1; min-width: 0; font-size: 14.5px; overflow-wrap: anywhere; }
  .file .fs { font-size: 12px; color: var(--muted); }
  .thumb { display: block; max-width: 220px; max-height: 240px; border-radius: 6px; cursor: zoom-in; object-fit: cover; }
  #lightbox { position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  #lightbox img { max-width: 92vw; max-height: 82vh; border-radius: 6px; }
  #lightbox .lbbar { display: flex; gap: 16px; align-items: center; color: #fff; font-size: 13px; }
  #lightbox a { color: #90caf9; }
  #lightbox button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .dev button { border: 0; background: none; color: var(--accent); font-size: 11.5px; padding: 0 0 0 6px; cursor: pointer; }
  .quote { margin-top: 4px; max-width: 100%; font-size: 12.5px; color: var(--muted); background: rgba(0,0,0,.05); border-radius: 4px; padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev { font-size: 11.5px; color: var(--muted); margin-top: 3px; padding-right: 2px; }
  .fwd-tag { display: inline-block; font-size: 11px; padding: 0 5px; margin-right: 5px; border-radius: 4px; background: rgba(43,108,176,.12); color: var(--accent); font-weight: 600; vertical-align: baseline; }
  .fwd-card, .fwd-long { margin-top: 2px; border: 1px solid var(--bubble-line); border-radius: 6px; padding: 6px 8px; background: rgba(127,127,127,.06); font-size: 13px; }
  .fwd-card summary, .fwd-long summary { cursor: pointer; list-style: none; user-select: none; }
  .fwd-card .fwd-title { font-weight: 600; margin-bottom: 3px; }
  .fwd-card .fwd-preview { color: var(--muted); font-size: 12px; white-space: pre-line; line-height: 1.4; }
  .fwd-card .fwd-list { margin: 6px 0 0; padding: 6px 0 0; border-top: 1px dashed var(--bubble-line); max-height: 260px; overflow-y: auto; font-size: 12.5px; line-height: 1.45; }
  .fwd-card .fwd-item + .fwd-item { margin-top: 4px; }
  .fwd-long pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; font: 12px/1.4 var(--mono); border-top: 1px dashed var(--bubble-line); padding-top: 6px; }
  .mention-pill { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; background: rgba(39,174,96,.12); color: #1f7a44; font-size: 11px; }
  .sel-badge { display: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; align-self: center; font-size: 11px; line-height: 15px; text-align: center; color: #fff; }
  body.select-mode .sel-badge { display: inline-block; }
  body.select-mode .bubble { cursor: pointer; }
  .row.selected .sel-badge { background: var(--accent); border-color: var(--accent); }
  .row.selected .bubble { box-shadow: inset 0 0 0 2px var(--accent); }
  #selectBar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; background: var(--bar); border-top: 1px solid var(--line); font-size: 12.5px; }
  #selectBar span { margin-right: auto; color: var(--muted); }
  #selectBar button { border: 1px solid var(--line); background: var(--bubble); color: var(--ink); border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  #selectBar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #selectBar button:disabled { opacity: .45; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .act { border: 1px solid var(--line); background: var(--bar); color: var(--ink); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; transition: opacity .15s; }
  .act.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .act.danger { color: #c0392b; border-color: rgba(192,57,43,.35); }
  .act:disabled { opacity: .45; cursor: default; }
  .act.picked { opacity: 1; font-weight: 600; box-shadow: inset 0 0 0 1px currentColor; }
  .empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; font-size: 14px; line-height: 1.7; }

  #reply { display: none; align-items: center; gap: 8px; padding: 6px 12px 0; background: var(--bar); font-size: 13px; color: var(--muted); }
  #reply.on { display: flex; }
  #reply span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--muted); padding-left: 8px; }
  #reply button { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  form.bar { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--bar); }
  .round { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; display: grid; place-items: center; cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
  .sendbtn { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 6px; background: #07c160; color: #fff; font-weight: 600; cursor: pointer; }
  header .dev, .sbtn { border: 1px solid var(--line); background: var(--bubble); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .sbtn { padding: 6px 10px; border-radius: 6px; flex: none; height: 36px; }
  textarea#box { flex: 1; resize: none; max-height: 120px; min-height: 38px; padding: 8px 10px; border: 0; border-radius: 6px; background: var(--bubble); }
  #toasts { position: fixed; top: 56px; right: 12px; z-index: 90; display: flex; flex-direction: column; gap: 6px; max-width: 300px; pointer-events: none; }
  .toast { background: rgba(24,24,27,.92); color: #fff; border-radius: 10px; padding: 9px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.22); font-size: 12.5px; line-height: 1.4; border-left: 3px solid #07c160; }
  .toast.urgent { border-left-color: #ef4444; }
  .toast strong { display: block; font-size: 13px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" id="ombLink" href="http://127.0.0.1:8799/" target="_blank" rel="noopener" title="打开后台控制台"><b>‹</b>后台</a>
    <h1><span id="chatTitle">自聊</span><small id="sub">co-bot 协调助手</small></h1>
    <span class="more"><button class="dev" id="selectBtn" type="button" title="多选消息转发">多选</button><button class="dev" id="devBtn" type="button" title="切换发送设备标识">手机发</button><i class="dot" id="dot" title="连接状态"></i></span>
  </header>
  <div class="chat-tabs" id="chatTabs">
    <button type="button" class="ctab active" data-chat="self">自聊<span class="ubadge">0</span></button>
    <button type="button" class="ctab" data-chat="grp_dev">研发架构群<span class="ubadge">0</span></button>
    <button type="button" class="ctab" data-chat="dm_alice">Alice<span class="ubadge">0</span></button>
  </div>
  <div id="list"></div>
  <div id="reply"><span id="replyText"></span><button type="button" id="replyX" aria-label="取消引用">×</button></div>
  <div id="selectBar" hidden>
    <span id="selectCount">已选 0 条</span>
    <button type="button" id="fwdSingleSelfBtn" disabled>逐条→自聊</button>
    <button type="button" class="primary" id="fwdMergeSelfBtn" disabled>合并→自聊</button>
    <button type="button" id="fwdMergeHereBtn" disabled hidden>合并→当前群</button>
    <button type="button" id="selectCancelBtn">取消</button>
  </div>
  <form class="bar" id="form">
    <input type="file" id="fileIn" hidden>
    <button class="sbtn" id="senderBtn" type="button" title="切换发送成员身份（模拟同事发言构造上下文）" hidden>我</button>
    <button class="sbtn" id="atMeBtn" type="button" title="插入 @我 以触发被动提及提醒/协作测试" hidden>@我</button>
    <textarea id="box" rows="1" placeholder="发 @bot …（支持 Ctrl+V 粘贴截图）" autocomplete="off" aria-label="输入消息"></textarea>
    <button class="round" id="pickBtn" type="button" title="发送文件或截图" aria-label="发送文件">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
    </button>
    <button class="sendbtn" id="sendBtn" type="submit" hidden>发送</button>
  </form>
</div>
  <div id="toasts" aria-live="polite"></div>
  <div id="lightbox" hidden><img id="lbImg" alt=""><div class="lbbar"><span id="lbName"></span><a id="lbRaw" href="#" target="_blank" rel="noopener">原图</a><button type="button" id="lbClose">关闭</button></div></div>
<script src="/md.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const list = $('#list'), box = $('#box'), replyBar = $('#reply');
  const CHATS = {
    self: { id: 'self', type: 'self', name: '自聊' },
    grp_dev: { id: 'grp_dev', type: 'group', name: '研发架构群' },
    dm_alice: { id: 'dm_alice', type: 'direct', name: 'Alice' },
  };
  const SENDER_CYCLE = ['me', 'alice', 'bob'];
  const SENDER_LABELS = { me: '我', alice: 'Alice', bob: 'Bob' };
  const allMsgs = [];
  const seen = new Map();
  const unread = { self: 0, grp_dev: 0, dm_alice: 0 };
  let activeChat = 'self', sender = 'me', replyTo = null, lastTs = 0, device = 'mobile', brandName = 'co-bot';
  let selectMode = false;
  let activeDraftIds = null;
  const selectedIds = new Set();
  const DEV = { mobile: '手机发', desktop: '电脑发' };

  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const stamp = (ts) => {
    const d = new Date(ts), now = new Date();
    const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (dayKey(d) === dayKey(now)) return `今天 ${hm}`;
    const yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    if (dayKey(d) === dayKey(yest)) return `昨天 ${hm}`;
    if (d.getFullYear() === now.getFullYear()) return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
  };
  const snip = (t) => String(t || '').replace(/\s+/g, ' ').slice(0, 50);
  const label = (m) => (m.file ? `[文件] ${m.file.name}` : (m.forwarded ? `[合并转发] ${m.forwarded.title || '聊天记录'}（${(m.forwarded.messages || []).length} 条）` : snip(m.text)));
  const size = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`);
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

  function renderEmptyHint() {
    if (list.children.length) return;
    const d = document.createElement('div');
    d.className = 'empty';
    d.id = 'empty';
    if (activeChat === 'self') {
      d.innerHTML = '这里模拟 IM 手机端自聊 → co-bot（Coordinator Bot 个人协调助手）。<br><br>试试：<b>@bot 你好</b> · <b>@bot help</b>（查看指令清单）<br>回复后 2 分钟内可直接续聊免 <b>@bot</b>，连续贴图也能直接发送（<b>#</b>/备忘开头只记笔记）<br>跨群协同：<b>@bot chats</b> · <b>@bot mute/unmute &lt;群&gt;</b> · <b>@bot summary &lt;群&gt;</b> · <b>@bot sendback</b> · <b>@bot bind</b> · <b>@bot delegate</b><br>会话与控制：<b>@bot status [群]</b> · <b>@bot new</b> · <b>@bot task [序号]</b> · <b>@bot compact [群]</b> · <b>@bot stop</b> · <b>@bot bye</b>（审批/提问卡回 <b>1 / 2 / 0</b> 或 <b>ok / always / no</b>）<br><br>支持 <b>Ctrl+V</b> 粘贴截图（点图放大预览），或点右下角 <b>+</b> 发文件。';
    } else {
      d.innerHTML = `这是模拟<b>${CHATS[activeChat].name}</b>（群聊 / 私聊场景）。<br><br>1. 点击输入框左侧 <b>我 / Alice / Bob</b> 切换身份发送或<b>撤回</b>消息/文件，构建多轮上下文；<br>2. 点任意气泡上的 <b>引用</b>，再切回 <b>我</b> 发送 <b>@bot 怎么看？</b>（原地回复）；<br>3. 发送 <b>@bot! 总结上面讨论</b> 或 <b>@bot -p ...</b> 可将结果私密发回「自聊」，确认后再 <b>@bot sendback</b> 回发。`;
    }
    list.append(d);
  }

  function updateChatChrome() {
    const meta = CHATS[activeChat];
    $('#chatTitle').textContent = meta.name;
    document.title = `${meta.name} · ${brandName}`;
    const isSelf = activeChat === 'self';
    $('#senderBtn').hidden = isSelf;
    if (isSelf) sender = 'me';
    $('#senderBtn').textContent = SENDER_LABELS[sender] || '我';
    $('#atMeBtn').hidden = isSelf || sender === 'me';
    box.placeholder = isSelf
      ? '发 @bot …（支持 Ctrl+V 粘贴截图）'
      : (sender === 'me'
        ? '发 @bot … 或 @bot! 私密回自聊'
        : `以 ${SENDER_LABELS[sender]} 身份发言（仅用于构建群聊上下文）`);
    for (const tab of document.querySelectorAll('#chatTabs .ctab')) {
      const cid = tab.dataset.chat;
      tab.classList.toggle('active', cid === activeChat);
      const cnt = unread[cid] || 0;
      tab.classList.toggle('has-unread', cnt > 0);
      const badge = tab.querySelector('.ubadge');
      if (badge) badge.textContent = String(cnt);
    }
  }

  function appendMsgDom(msg, forceScroll = false) {
    const nearBottom = forceScroll || msg.from === 'me' || (list.scrollHeight - list.scrollTop - list.clientHeight < 80);
    $('#empty')?.remove();
    if (msg.ts - lastTs > 3 * 60 * 1000) {
      const w = document.createElement('div');
      w.className = 'when';
      w.textContent = stamp(msg.ts);
      list.append(w);
    }
    lastTs = msg.ts;

    if (msg.from === 'me' || (msg.from === 'bot' && Array.isArray(msg.actions) && msg.actions.length)) {
      for (const oldBtn of list.querySelectorAll('.actions button:not(:disabled):not([data-keep-active="1"])')) {
        oldBtn.disabled = true;
      }
    }
    const row = document.createElement('div');
    const rowKind = msg.from === 'bot' ? 'bot' : (msg.isSelf === false || msg.from === 'other' ? 'other' : 'me');
    row.className = 'row ' + rowKind;
    if (msg.id) row.dataset.msgId = msg.id;
    const col = document.createElement('div');
    col.className = 'col';
    if (rowKind === 'other' && msg.senderName) {
      const sl = document.createElement('div');
      sl.className = 'sender-lbl';
      sl.textContent = msg.senderName;
      col.append(sl);
    }
    const b = document.createElement('div');
    b.className = 'bubble';

    if (msg.file) {
      const f = msg.file, ext = (f.name.split('.').pop() || '').toLowerCase();
      const safeExt = ext.replace(/[^a-z0-9]/g, '');
      const isImg = /^image\//i.test(f.mime || '') || /^(png|jpe?g|gif|webp)$/.test(ext);
      if (isImg) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = f.url;
        img.alt = f.name;
        img.addEventListener('load', () => { if (nearBottom) list.scrollTop = list.scrollHeight; });
        img.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(f); });
        b.append(img);
      } else {
        const a = document.createElement('a');
        a.className = 'file';
        a.href = f.url;
        a.target = '_blank';
        a.rel = 'noopener';
        const fn = Object.assign(document.createElement('span'), { className: 'fn' });
        fn.append(f.name, Object.assign(document.createElement('div'), { className: 'fs', textContent: size(f.size) }));
        const fi = Object.assign(document.createElement('span'), {
          className: safeExt ? `fi ${safeExt}` : 'fi',
          textContent: (safeExt || ext).slice(0, 4).toUpperCase() || 'FILE',
        });
        a.append(fn, fi);
        b.append(a);
      }
    } else if (msg.forwarded) {
      const det = document.createElement('details');
      det.className = 'fwd-card';
      const sum = document.createElement('summary');
      const items = Array.isArray(msg.forwarded.messages) ? msg.forwarded.messages : [];
      const ft = Object.assign(document.createElement('div'), {
        className: 'fwd-title',
        textContent: `[合并转发] ${msg.forwarded.title || '聊天记录'}（共 ${items.length} 条）`,
      });
      const fp = Object.assign(document.createElement('div'), {
        className: 'fwd-preview',
        textContent: items.slice(0, 3).map((it) => `${it.senderName || '成员'}: ${snip(it.text || (it.attachments?.length ? '[附件]' : '[消息]'))}`).join('\n') || '点击展开查看记录',
      });
      sum.append(ft, fp);
      const fl = document.createElement('div');
      fl.className = 'fwd-list';
      items.forEach((it, idx) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'fwd-item';
        rowEl.textContent = `${idx + 1}. ${it.senderName || '成员'}: ${it.text || (it.attachments?.length ? `[附件: ${it.attachments.map((x) => x.name).join(', ')}]` : '[消息]')}`;
        fl.append(rowEl);
      });
      det.append(sum, fl);
      b.append(det);
    } else if (msg.isForwarded && String(msg.text || '').length > 700) {
      const tag = Object.assign(document.createElement('span'), { className: 'fwd-tag', textContent: '转发' });
      const det = document.createElement('details');
      det.className = 'fwd-long';
      const sum = document.createElement('summary');
      sum.append(tag, document.createTextNode(`${String(msg.text).slice(0, 180)}… （共 ${String(msg.text).length} 字，点击展开原文）`));
      const fullPre = Object.assign(document.createElement('pre'), { textContent: msg.text });
      det.append(sum, fullPre);
      b.append(det);
    } else {
      const m = rowKind === 'me' && msg.text.match(/^(@\S+)\s*([\s\S]*)$/);
      const md = document.createElement('div');
      md.className = 'md';
      md.innerHTML = renderMarkdown(m ? m[2] : msg.text);
      if (msg.isForwarded) {
        const tag = Object.assign(document.createElement('span'), { className: 'fwd-tag', textContent: '转发' });
        (md.firstElementChild?.tagName === 'P' ? md.firstElementChild : md).prepend(tag);
      }
      if (m) {
        const at = document.createElement('span');
        at.className = 'at';
        at.textContent = m[1] + ' ';
        (md.firstElementChild?.tagName === 'P' ? md.firstElementChild : md).prepend(at);
      }
      b.append(md);
    }
    if (msg.from === 'bot' && Array.isArray(msg.actions) && msg.actions.length) {
      const wrap = document.createElement('div');
      wrap.className = 'actions';
      for (const act of msg.actions) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'act' + (act.kind ? ' ' + act.kind : '');
        btn.textContent = act.label;
        const dm = /\b(draft_[a-z0-9_-]+)\b/i.exec(act.text || '');
        if (dm) {
          btn.dataset.keepActive = '1';
          btn.dataset.draftId = dm[1];
          if (activeDraftIds && !activeDraftIds.has(dm[1])) btn.disabled = true;
        }
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          for (const sibling of wrap.querySelectorAll('button')) sibling.disabled = true;
          btn.classList.add('picked');
          send(act.text, { fromInput: false });
        });
        wrap.append(btn);
      }
      b.append(wrap);
    }
    col.append(b);

    const q = msg.replyTo && seen.get(msg.replyTo);
    if (q) {
      const d = document.createElement('div');
      d.className = 'quote';
      d.textContent = `${q.senderName ? q.senderName + ': ' : ''}${label(q)}`;
      col.append(d);
    }
    const dv = document.createElement('div');
    dv.className = 'dev';
    dv.textContent = msg.from === 'bot' ? `${msg.device} · ${brandName}` : (msg.senderName && rowKind === 'other' ? msg.senderName : msg.device);
    if (msg.from === 'bot' && Array.isArray(msg.mentions) && msg.mentions.length) {
      const mp = Object.assign(document.createElement('span'), {
        className: 'mention-pill',
        textContent: `真@ ${msg.mentions.map((x) => `${x.name || x.id} (${x.id})`).join(', ')}`,
      });
      dv.append(mp);
    }
    col.append(dv);

    const r = document.createElement('button');
    r.type = 'button';
    r.textContent = '引用';
    r.onclick = (e) => { e.stopPropagation(); setReply(msg); };
    dv.append(r);
    if ((msg.chatId || 'self') !== 'self' && (msg.text || msg.forwarded)) {
      const fw = document.createElement('button');
      fw.type = 'button';
      fw.textContent = '转发到自聊';
      fw.onclick = async (e) => {
        e.stopPropagation();
        const res = await post('/send', {
          chatId: 'self',
          sender: 'me',
          text: msg.text ? `${msg.senderName ? `${msg.senderName}: ` : ''}${msg.text}` : '',
          isForwarded: true,
          ...(msg.forwarded ? { forwarded: msg.forwarded } : {}),
          device,
        });
        if (!res.ok) alert((await res.json().catch(() => ({}))).error || '转发失败');
      };
      dv.append(fw);
    }
    if (msg.from !== 'bot' && msg.id) {
      const rc = document.createElement('button');
      rc.type = 'button';
      rc.textContent = '撤回';
      rc.onclick = async (e) => {
        e.stopPropagation();
        const res = await post('/recall', { chatId: msg.chatId || activeChat, msgId: msg.id, sender: msg.senderId || sender });
        if (!res.ok) alert((await res.json().catch(() => ({}))).error || '撤回失败');
      };
      dv.append(rc);
    }
    b.title = '点一下引用这条消息';
    b.addEventListener('click', (e) => {
      if (window.getSelection()?.toString()) return;
      if (e.target.closest('a, button, img, details, summary')) return;
      if (selectMode && msg.id) {
        toggleSelect(msg.id, row);
        return;
      }
      setReply(msg);
    });

    const sb = document.createElement('span');
    sb.className = 'sel-badge';
    sb.textContent = msg.id && selectedIds.has(msg.id) ? '✓' : '';
    if (msg.id && selectedIds.has(msg.id)) row.classList.add('selected');
    sb.onclick = (e) => { e.stopPropagation(); if (msg.id) toggleSelect(msg.id, row); };

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = rowKind === 'other' ? (msg.senderName || '?').slice(0, 2) : '我';
    if (rowKind === 'other') row.append(sb, av, col);
    else row.append(sb, col, av);
    list.append(row);
    if (nearBottom) list.scrollTop = list.scrollHeight;
  }

  function syncDraftButtons(inbox) {
    if (!inbox) return;
    activeDraftIds = new Set([
      ...(inbox.drafts || []).map((d) => d.id),
      ...(inbox.sendBacks || []).map((sb) => sb.id),
    ].filter(Boolean));
    for (const btn of list.querySelectorAll('.actions button[data-draft-id]')) {
      if (!activeDraftIds.has(btn.dataset.draftId)) btn.disabled = true;
    }
  }

  function renderActiveChat() {
    list.innerHTML = '';
    lastTs = 0;
    const msgs = allMsgs.filter((m) => (m.chatId || 'self') === activeChat);
    if (!msgs.length) renderEmptyHint();
    else for (const m of msgs) appendMsgDom(m, true);
    if (activeDraftIds) {
      for (const btn of list.querySelectorAll('.actions button[data-draft-id]')) {
        if (!activeDraftIds.has(btn.dataset.draftId)) btn.disabled = true;
      }
    }
  }

  function add(msg) {
    if (seen.has(msg.id)) return;
    seen.set(msg.id, msg);
    allMsgs.push(msg);
    const cid = msg.chatId || 'self';
    if (cid === activeChat) {
      appendMsgDom(msg);
    } else {
      unread[cid] = (unread[cid] || 0) + 1;
      updateChatChrome();
    }
  }

  function handleRecall(ev) {
    const mid = ev?.recalledMsgId;
    if (!mid) return;
    seen.delete(mid);
    const removedSelected = selectedIds.delete(mid);
    const idx = allMsgs.findIndex((m) => m.id === mid);
    if (idx >= 0) allMsgs.splice(idx, 1);
    if (replyTo === mid) {
      replyTo = null;
      replyBar.classList.remove('on');
    }
    if (removedSelected) updateSelectBar();
    const cid = ev.chatId || 'self';
    if (cid === activeChat) {
      renderActiveChat();
    } else if (unread[cid] > 0) {
      unread[cid] = Math.max(0, unread[cid] - 1);
      updateChatChrome();
    }
  }

  function updateSelectBar() {
    document.body.classList.toggle('select-mode', selectMode);
    $('#selectBtn').textContent = selectMode ? '完成' : '多选';
    $('#selectBar').hidden = !selectMode;
    const count = selectedIds.size;
    $('#selectCount').textContent = `已选 ${count} 条`;
    $('#fwdSingleSelfBtn').disabled = count === 0;
    $('#fwdMergeSelfBtn').disabled = count === 0;
    const hereBtn = $('#fwdMergeHereBtn');
    hereBtn.hidden = activeChat === 'self';
    hereBtn.disabled = count === 0;
  }

  function toggleSelect(id, rowEl) {
    if (!id) return;
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    if (rowEl) {
      rowEl.classList.toggle('selected', selectedIds.has(id));
      const badge = rowEl.querySelector('.sel-badge');
      if (badge) badge.textContent = selectedIds.has(id) ? '✓' : '';
    }
    updateSelectBar();
  }

  function exitSelectMode() {
    selectMode = false;
    selectedIds.clear();
    for (const r of list.querySelectorAll('.row.selected')) {
      r.classList.remove('selected');
      const b = r.querySelector('.sel-badge');
      if (b) b.textContent = '';
    }
    updateSelectBar();
  }

  function switchChat(cid) {
    if (!CHATS[cid] || cid === activeChat) return;
    exitSelectMode();
    activeChat = cid;
    unread[cid] = 0;
    replyTo = null;
    replyBar.classList.remove('on');
    updateChatChrome();
    renderActiveChat();
    refreshStatus();
  }

  for (const tab of document.querySelectorAll('#chatTabs .ctab')) {
    tab.addEventListener('click', () => switchChat(tab.dataset.chat));
  }
  $('#selectBtn').onclick = () => {
    if (selectMode) exitSelectMode();
    else { selectMode = true; updateSelectBar(); }
  };
  $('#selectCancelBtn').onclick = exitSelectMode;
  async function sendSelectedForward(mode, targetChat) {
    const picked = allMsgs.filter((m) => m.id && selectedIds.has(m.id));
    if (!picked.length) return;
    if (mode === 'single') {
      for (const m of picked) {
        const prefix = m.senderName && !m.forwarded ? `${m.senderName}: ` : '';
        const text = m.text ? `${prefix}${m.text}` : (m.file ? `[附件: ${m.file.name}]` : '');
        const res = await post('/send', {
          chatId: targetChat,
          sender: 'me',
          text,
          isForwarded: true,
          ...(m.forwarded ? { forwarded: m.forwarded } : {}),
          device,
        });
        if (!res.ok) { alert((await res.json().catch(() => ({}))).error || '转发失败'); return; }
      }
    } else {
      const items = picked.map((m) => ({
        id: m.id,
        senderName: m.senderName || (m.isSelf ? '我' : '成员'),
        senderId: m.senderId,
        ts: m.ts,
        text: m.text || (m.forwarded ? `[合并转发: ${m.forwarded.title || '聊天记录'}]` : (m.file ? `[附件: ${m.file.name}]` : '[消息]')),
      }));
      const res = await post('/send', {
        chatId: targetChat,
        sender: 'me',
        text: '',
        isForwarded: true,
        forwarded: { title: `${CHATS[activeChat]?.name || activeChat}的聊天记录`, messages: items },
        device,
      });
      if (!res.ok) { alert((await res.json().catch(() => ({}))).error || '合并转发失败'); return; }
    }
    exitSelectMode();
    setTimeout(refreshStatus, 180);
  }
  $('#fwdSingleSelfBtn').onclick = () => sendSelectedForward('single', 'self');
  $('#fwdMergeSelfBtn').onclick = () => sendSelectedForward('merged', 'self');
  $('#fwdMergeHereBtn').onclick = () => sendSelectedForward('merged', activeChat);
  $('#senderBtn').onclick = () => {
    const idx = SENDER_CYCLE.indexOf(sender);
    sender = SENDER_CYCLE[(idx + 1) % SENDER_CYCLE.length];
    updateChatChrome();
  };
  $('#atMeBtn').onclick = () => {
    if (!/(?:^|\s)@我(?:\s|$)/.test(box.value)) {
      box.value = `@我 ${box.value}`.replace(/\s+$/, ' ');
    }
    grow();
    box.focus();
  };

  function showToast(note) {
    const wrap = $('#toasts');
    if (!wrap) return;
    const item = document.createElement('div');
    item.className = `toast${note?.urgent ? ' urgent' : ''}`;
    const strong = document.createElement('strong');
    strong.textContent = String(note?.title || brandName || '通知');
    const bodyEl = document.createElement('div');
    bodyEl.textContent = String(note?.body || '');
    item.append(strong, bodyEl);
    wrap.append(item);
    setTimeout(() => item.remove(), 5000);
  }

  function openLightbox(f) {
    $('#lbImg').src = f.url;
    $('#lbImg').alt = f.name;
    $('#lbName').textContent = `${f.name} (${size(f.size)})`;
    $('#lbRaw').href = f.url;
    $('#lightbox').hidden = false;
  }
  $('#lbClose').onclick = () => { $('#lightbox').hidden = true; $('#lbImg').src = ''; };
  $('#lightbox').onclick = (e) => { if (e.target.id === 'lightbox') $('#lbClose').click(); };
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#lightbox').hidden) $('#lbClose').click();
    else if (selectMode) exitSelectMode();
    else if (replyTo) $('#replyX').click();
  });

  function setReply(msg) {
    replyTo = msg.id;
    $('#replyText').textContent = `${msg.senderName ? msg.senderName + ': ' : ''}${label(msg)}`;
    replyBar.classList.add('on');
    box.focus();
  }
  $('#replyX').onclick = () => { replyTo = null; replyBar.classList.remove('on'); };
  $('#devBtn').onclick = () => { device = device === 'mobile' ? 'desktop' : 'mobile'; $('#devBtn').textContent = DEV[device]; };

  async function send(text, { fromInput = true } = {}) {
    const prev = text;
    text = text.trim();
    if (!text) return;
    const prevReply = fromInput ? replyTo : null;
    const body = { chatId: activeChat, sender, text, replyTo: prevReply, device };
    if (fromInput) {
      box.value = '';
      replyTo = null;
      replyBar.classList.remove('on');
      grow();
    }
    try {
      const r = await post('/send', body);
      if (!r.ok) {
        const err = (await r.json().catch(() => ({}))).error || '发送失败';
        if (fromInput) {
          box.value = prev;
          replyTo = prevReply;
          if (prevReply) replyBar.classList.add('on');
          grow();
        }
        alert(err);
        return;
      }
      setTimeout(refreshStatus, 180);
    } catch (e) {
      if (fromInput) {
        box.value = prev;
        replyTo = prevReply;
        if (prevReply) replyBar.classList.add('on');
        grow();
      }
      alert(e.message || '网络异常，发送失败');
    }
  }

  async function uploadFileObj(f) {
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) return alert('模拟器最大支持 8 MB 文件');
    const prevReply = replyTo;
    replyTo = null;
    replyBar.classList.remove('on');
    try {
      const data = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] ?? '');
        r.onerror = () => rej(new Error('读取文件失败'));
        r.readAsDataURL(f);
      });
      const name = f.name || `screenshot-${Date.now()}.png`;
      const body = { chatId: activeChat, sender, name, data, device, replyTo: prevReply };
      const r = await post('/upload', body);
      if (!r.ok) {
        replyTo = prevReply;
        if (prevReply) replyBar.classList.add('on');
        alert((await r.json().catch(() => ({}))).error || '上传失败');
      }
    } catch (e) {
      replyTo = prevReply;
      if (prevReply) replyBar.classList.add('on');
      alert(e?.message || '上传失败');
    }
  }

  function grow() {
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 120) + 'px';
    const typing = box.value.trim().length > 0;
    $('#sendBtn').hidden = !typing;
    $('#pickBtn').hidden = typing;
  }
  box.addEventListener('input', grow);
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(box.value); } });
  box.addEventListener('paste', (e) => {
    const file = [...(e.clipboardData?.items ?? [])].find((it) => it.kind === 'file')?.getAsFile() || e.clipboardData?.files?.[0];
    if (!file) return;
    if (!e.clipboardData?.getData('text/plain')) e.preventDefault();
    uploadFileObj(file);
  });
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); send(box.value); });
  $('#pickBtn').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = async () => { const f = $('#fileIn').files[0]; $('#fileIn').value = ''; await uploadFileObj(f); };

  async function refreshStatus() {
    try {
      const s = await fetch('/api/status').then((r) => r.json());
      const omb = s.openmausbot;
      const br = s.bridge;
      if (br?.botName) {
        brandName = br.botName;
        document.title = `${brandName} · IM 模拟器`;
      }
      if (omb?.url) $('#ombLink').href = omb.url;
      if (omb?.ok) {
        const chief = omb.bots.find((b) => b.chiefOfStaff) || omb.bots[0];
        const chiefDisplay = chief?.displayName || brandName;
        const focusName = br?.focus?.botName || chiefDisplay;
        const busyBot = omb.bots.find((b) => b.id === br?.focus?.botId && b.busy) || omb.bots.find((b) => b.busy);
        if (br?.sseAuthFailed || omb.authError) {
          $('#sub').textContent = '后台服务认证失效（请运行 npm run pair）';
        } else if (omb.desktopManaged && !omb.paired) {
          $('#sub').textContent = `${brandName} · 未配对（运行 npm run pair）`;
        } else if (busyBot || (br?.activeTurns ?? 0) > 0) {
          const whoBusy = busyBot ? (busyBot.displayName || busyBot.name) : focusName;
          const qText = (br?.queuedCount ?? 0) > 0 ? ` · 排队 ${br.queuedCount}` : '';
          $('#sub').textContent = `${whoBusy} 正在处理…${qText}`;
          if (activeChat === 'self') {
            box.placeholder = '输入继续补充，或发 @bot steer 插队…';
          }
        } else if (activeChat !== 'self') {
          $('#sub').textContent = `${brandName} · @bot 原地回复 / @bot! 私聊`;
          box.placeholder = sender === 'me'
            ? '发 @bot … 或 @bot! 私密回自聊'
            : `以 ${SENDER_LABELS[sender]} 身份发言（仅用于构建群聊上下文）`;
        } else if (br?.stickyActive) {
          $('#sub').textContent = `连续对话中 · ${focusName}`;
          box.placeholder = '连续对话中，直接回复即可（# 开头只记笔记）';
        } else {
          $('#sub').textContent = chiefDisplay === brandName ? `${brandName} · 个人协调助手` : `${brandName} · ${chiefDisplay}`;
          box.placeholder = '发 @bot …（支持 Ctrl+V 粘贴截图）';
        }
      } else if (omb?.error) {
        $('#sub').textContent = '未连上后台服务';
      }
      if (br?.inbox) syncDraftButtons(br.inbox);
    } catch { /* ignore polling error */ }
  }

  updateChatChrome();
  renderActiveChat();
  refreshStatus();
  setInterval(() => { if (!document.hidden) refreshStatus(); }, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });

  let replayingHistory = false;
  let replayBuf = [];
  const es = new EventSource('/events');
  es.onopen = () => $('#dot').classList.add('on');
  es.onerror = () => $('#dot').classList.remove('on');
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.kind === 'history_start') {
      replayingHistory = true;
      replayBuf = [];
      return;
    }
    if (msg.kind === 'history_end') {
      replayingHistory = false;
      seen.clear();
      allMsgs.length = 0;
      for (const m of replayBuf) {
        if (!seen.has(m.id)) {
          seen.set(m.id, m);
          allMsgs.push(m);
        }
      }
      replayBuf = [];
      renderActiveChat();
      updateChatChrome();
      refreshStatus();
      return;
    }
    if (msg.kind === 'recall') { handleRecall(msg); return; }
    if (msg.kind === 'notify') { showToast(msg); return; }
    if (replayingHistory) {
      replayBuf.push(msg);
      return;
    }
    add(msg);
    if (msg.from === 'bot') refreshStatus();
  };
</script>
</body>
</html>
