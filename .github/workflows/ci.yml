name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund --fetch-retries=5; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm install attempt ${attempt} failed; retrying in 15s..."
              sleep 15
            fi
          done
          exit 1

      - name: Run full verification (lint, tests, channel contract)
        run: npm run verify

      - name: Preview autostart service spec
        run: node scripts/daemon.js install-service --dry
